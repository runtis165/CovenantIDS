
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RFID Admin Directory</title>

<style>
* { box-sizing: border-box; }

body {
    font-family: Arial, sans-serif;
    max-width: 1000px;
    margin: 30px auto;
    padding: 0 18px;
    background: #111;
    color: #eee;
}

h1 { margin-bottom: 5px; }

.subtitle {
    color: #999;
    margin-bottom: 25px;
}

input {
    width: 100%;
    padding: 13px;
    margin: 8px 0 18px;
    border: 1px solid #444;
    border-radius: 6px;
    background: #222;
    color: white;
    font-size: 16px;
}

.settings {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
}

.settings div {
    flex: 1;
    min-width: 150px;
}

label {
    font-size: 13px;
    color: #aaa;
}

#status {
    margin: 10px 0;
    color: #aaa;
    font-size: 14px;
}

#error {
    color: #ff6666;
    margin: 12px 0;
    white-space: pre-wrap;
}

.table-container {
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 15px;
}

th, td {
    padding: 13px 10px;
    text-align: left;
    border-bottom: 1px solid #333;
}

th {
    background: #222;
    position: sticky;
    top: 0;
}

tr:hover { background: #202020; }

a {
    color: #66b5ff;
    text-decoration: none;
    font-family: monospace;
    font-weight: bold;
}

a:hover { text-decoration: underline; }
</style>
</head>

<body>

<h1>RFID Admin Directory</h1>
<p class="subtitle">125 kHz HID H10301 RFID Database</p>

<div class="settings">
    <div>
        <label for="facility">Facility Code</label>
        <input id="facility" type="number"
               min="0" max="255" value="254">
    </div>

    <div>
        <label for="search">Search Database</label>
        <input id="search" type="search"
               placeholder="Search names or IDs...">
    </div>
</div>

<div id="status">Loading database...</div>
<div id="error"></div>

<div class="table-container">
<table>
<thead>
<tr>
    <th>Name</th>
    <th>ID</th>
    <th>Hex (Download)</th>
</tr>
</thead>
<tbody id="results"></tbody>
</table>
</div>

<!-- =========================================
     MAIN APPLICATION SCRIPT
     LEAVE EVERYTHING BELOW THIS LINE ALONE.
     ========================================= -->

<script>
(() => {

"use strict";

function startApplication() {

    const databaseElement =
        document.getElementById("database-data");

    const searchInput =
        document.getElementById("search");

    const facilityInput =
        document.getElementById("facility");

    const results =
        document.getElementById("results");

    const status =
        document.getElementById("status");

    const error =
        document.getElementById("error");

    let records = [];


    // Convert facility code and ID to hexadecimal.

    function hexFor(id, facility) {

        return facility.toString(16)
            .padStart(2, "0")
            .toUpperCase()
            +
            id.toString(16)
            .padStart(4, "0")
            .toUpperCase();

    }


    // Generate Flipper RFID file.

    function downloadRFID(record, hex) {

        const data = hex.match(/.{2}/g).join(" ");

        const content = [
            "Filetype: Flipper RFID key",
            "Version: 1",
            "Key type: H10301",
            "Data: " + data
        ].join("\n") + "\n";

        const blob = new Blob(
            [content],
            { type: "text/plain;charset=utf-8" }
        );

        const url = URL.createObjectURL(blob);

        const filename = (
            record.first + "_" +
            record.last + "_" +
            record.id
        ).replace(/[^a-z0-9_-]/gi, "_");

        const link = document.createElement("a");

        link.href = url;
        link.download = filename + ".rfid";

        document.body.appendChild(link);
        link.click();
        link.remove();

        setTimeout(() => {
            URL.revokeObjectURL(url);
        }, 1000);

    }


    // Display matching records.

    function render() {

        const query =
            searchInput.value.trim().toLowerCase();

        const facility =
            Number(facilityInput.value);

        results.replaceChildren();

        if (
            !Number.isInteger(facility) ||
            facility < 0 ||
            facility > 255
        ) {
            status.textContent = "";
            error.textContent =
                "Facility code must be between 0 and 255.";
            return;
        }

        error.textContent = "";

        const fragment =
            document.createDocumentFragment();

        let count = 0;

        for (const record of records) {

            const searchable = (
                record.first + " " +
                record.last + " " +
                record.id
            ).toLowerCase();

            if (!searchable.includes(query)) {
                continue;
            }

            const hex = hexFor(
                Number(record.id),
                facility
            );

            const row = document.createElement("tr");

            const nameCell = document.createElement("td");
            const idCell = document.createElement("td");
            const hexCell = document.createElement("td");

            nameCell.textContent =
                (record.first + " " + record.last).trim();

            idCell.textContent = record.id;

            const link = document.createElement("a");

            link.href = "#";
            link.textContent = hex;

            link.addEventListener("click", event => {
                event.preventDefault();
                downloadRFID(record, hex);
            });

            hexCell.appendChild(link);

            row.append(
                nameCell,
                idCell,
                hexCell
            );

            fragment.appendChild(row);

            count++;

        }

        results.appendChild(fragment);

        status.textContent =
            count.toLocaleString() +
            " of " +
            records.length.toLocaleString() +
            " records displayed.";

    }


    // Load and validate the embedded database.

    function loadDatabase() {

        try {

            const raw =
                databaseElement.textContent.trim();

            const database = JSON.parse(raw);

            if (!Array.isArray(database)) {
                throw new Error(
                    "Database must be a JSON array."
                );
            }

            const validated = [];
            let skipped = 0;

            database.forEach((record, index) => {

                try {

                    if (
                        !record ||
                        typeof record !== "object" ||
                        Array.isArray(record)
                    ) {
                        throw new Error("Invalid record.");
                    }

                    const first =
                        String(record.first ?? "").trim();

                    const last =
                        String(record.last ?? "").trim();

                    const id =
                        String(record.id ?? "").trim();

                    // Skip empty, missing, or null IDs.

                    if (id === "") {
                        skipped++;
                        return;
                    }

                    // Reject malformed IDs.

                    if (!/^\d+$/.test(id)) {
                        throw new Error("Invalid ID.");
                    }

                    const numericID = Number(id);

                    if (
                        !Number.isSafeInteger(numericID) ||
                        numericID < 0 ||
                        numericID > 65535
                    ) {
                        throw new Error(
                            "ID outside H10301 range."
                        );
                    }

                    validated.push({
                        first,
                        last,
                        id
                    });

                } catch (recordError) {

                    skipped++;

                }

            });

            records = validated;

            render();

            status.textContent =
                records.length.toLocaleString() +
                " records loaded. " +
                skipped.toLocaleString() +
                " records skipped.";

        } catch (err) {

            records = [];

            results.replaceChildren();

            status.textContent =
                "Database failed to load.";

            error.textContent =
                "Database Error: " + err.message;

        }

    }


    // Event listeners.

    searchInput.addEventListener(
        "input",
        render
    );

    facilityInput.addEventListener(
        "input",
        render
    );


    // Initialize.

    loadDatabase();

}


// Safely initialize after the page has loaded.

if (document.readyState === "loading") {

    document.addEventListener(
        "DOMContentLoaded",
        startApplication,
        { once: true }
    );

} else {

    startApplication();

}

})();
</script>
